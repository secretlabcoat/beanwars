<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BEANWARS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
html,body{margin:0;padding:0;height:100%;background:#0b0d12;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
#app{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1{font-size:3rem;margin:0.5rem}
.bean-btn{display:flex;flex-direction:column;align-items:center;justify-content:center}
.bean-shape{width:80px;height:40px;border-radius:40px/20px;margin-bottom:0.3rem}
.player-list{display:flex;flex-direction:column;align-items:center;margin:1rem 0}
.player-item{display:flex;align-items:center;margin:0.2rem 0}
.dot{width:14px;height:14px;border-radius:50%;margin-right:0.5rem}
.top-bar{position:absolute;top:0;left:0;width:100%;padding:0.5rem;background:rgba(0,0,0,0.5);display:flex;flex-wrap:wrap;justify-content:center;gap:0.5rem;font-size:0.9rem;z-index:2}
.overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2rem;pointer-events:none;z-index:2}
.hint{position:absolute;top:calc(100% - 2rem);left:50%;transform:translateX(-50%);font-size:0.9rem;color:#aaa;z-index:2}
#gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;touch-action:none;z-index:0;display:none}
#pileCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none}
body.lobby #pileCanvas{display:block}
#app{z-index:1}
#pad{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:none;justify-content:space-between;padding:0 16px;z-index:3;pointer-events:none}
#pad button{pointer-events:auto;min-width:64px;width:64px;min-height:52px;height:52px;padding:0;font-size:1.3rem;touch-action:none;margin:0}
body.ingame.player #pad{display:flex}
.hint{display:none}
body.ingame #app{pointer-events:none}
body.ingame #gameCanvas{display:block}
.connecting{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.5rem;color:#aaa;z-index:3}
button{min-height:52px;min-width:120px;font-size:1.2rem;padding:0 1.4rem;margin:0.5rem;border-radius:14px;border:1px solid rgba(120,170,255,.35);background:linear-gradient(180deg,#2e3a5e,#1a2034);color:#fff;cursor:pointer;box-shadow:0 0 14px rgba(76,123,255,.28),inset 0 1px 0 rgba(255,255,255,.14);transition:transform .1s,filter .1s,box-shadow .1s}
button:hover{filter:brightness(1.12);box-shadow:0 0 20px rgba(76,123,255,.5)}
button:active{transform:scale(.96);filter:brightness(1.22)}
button:disabled{background:#2a2e38;border-color:#444;color:#888;box-shadow:none;filter:none;transform:none;cursor:default}
.bean-btn{min-width:130px;min-height:100px;background:linear-gradient(180deg,#283250,#141824)}
.beanimg{object-fit:contain;display:block}
h1{font-size:3rem;letter-spacing:.08em}
#nameIn{font-size:1.2rem;padding:.7rem 1rem;border-radius:12px;border:1px solid #333;background:#161a23;color:#fff;width:240px;text-align:center;margin-bottom:.3rem}
#mute{position:fixed;top:calc(6px + env(safe-area-inset-top));right:8px;z-index:4;min-width:44px;width:44px;min-height:44px;height:44px;padding:0;font-size:1.1rem;margin:0}
body.ingame #mute{top:auto;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;right:auto;transform:translateX(-50%)}
body.home{background:#05030f url(/title.jpg) center top/100% auto no-repeat}
body.home #app{justify-content:flex-start}
.namebox{margin-top:calc(10px + env(safe-area-inset-top));background:rgba(5,3,15,.75);padding:.2rem .8rem .5rem;border-radius:14px;display:flex;flex-direction:column;align-items:center;z-index:2}
.namelabel{font-size:.9rem;color:#bbb;margin:.3rem 0}
#nameIn{background:rgba(10,12,20,.85);border:2px solid #4c7bff}
#nameIn.need{border-color:#ff4d4d}
.panel{width:100%;padding:1rem 0 calc(1.2rem + env(safe-area-inset-bottom));background:linear-gradient(to bottom,rgba(5,3,15,0),rgba(5,3,15,.92) 25%);display:flex;flex-direction:column;align-items:center}
.panel .player-list{margin:.4rem 0}
.inroom{font-size:.95rem;color:#ccc;margin-bottom:.2rem}
button.big{min-width:200px;font-size:1.5rem;font-weight:700;letter-spacing:.05em;border:0;background:linear-gradient(90deg,#4c7bff,#ff5fd2);box-shadow:0 0 22px rgba(255,95,210,.45)}
.toplist{width:min(92vw,420px);max-height:46vh;overflow:auto;background:rgba(10,14,28,.88);border:1px solid rgba(76,123,255,.35);border-radius:14px;padding:.4rem;box-shadow:0 0 24px rgba(76,123,255,.2)}
.toplist .row{display:grid;grid-template-columns:1.6rem 26px 1fr 2.6rem 2.7rem 2.6rem;align-items:center;gap:4px;padding:.38rem .35rem;border-bottom:1px solid rgba(255,255,255,.06);text-align:left;font-size:.9rem;animation:rise .4s ease both}
.toplist .row span:nth-child(n+4){text-align:right}
.toplist .hd{color:#9ab;font-size:.78rem;animation:none}
.toplist .r1{background:linear-gradient(90deg,rgba(240,193,78,.22),transparent);box-shadow:inset 0 0 12px rgba(240,193,78,.15)}
.toplist .r2{background:linear-gradient(90deg,rgba(180,200,220,.16),transparent)}
.toplist .r3{background:linear-gradient(90deg,rgba(200,135,90,.18),transparent)}
.toptitle{font-size:2rem;margin:.4rem 0 .2rem;letter-spacing:.12em;text-shadow:0 0 16px #4c7bff,0 0 28px #ff5fd2}
body.top{background:#05030f}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:.4rem;width:min(92vw,420px);margin:.2rem 0 .6rem}
.podium .spot{flex:1;background:rgba(12,16,32,.9);border:1px solid rgba(120,170,255,.3);border-radius:12px;padding:.4rem .2rem .5rem;animation:rise .5s ease both}
.podium .s1{order:2;min-height:8.2rem;border-color:#f0c14e;box-shadow:0 0 18px rgba(240,193,78,.35)}
.podium .s2{order:1;min-height:6.4rem;border-color:#c5d0e0;animation-delay:.08s}
.podium .s3{order:3;min-height:5.6rem;border-color:#c8875a;animation-delay:.16s}
.podium .place{font-size:.8rem;color:#ccc}
.podium .pname{font-size:.9rem;font-weight:700;margin-top:.15rem;word-break:break-word}
.podium .pstat{font-size:.8rem;color:#bcd}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes beanPop{0%{transform:scale(.2) rotate(-10deg);opacity:0}60%{transform:scale(1.16) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.wincard{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92vw,400px);max-height:82vh;overflow:auto;z-index:5;background:rgba(8,10,22,.92);border:1px solid rgba(255,95,210,.45);border-radius:18px;padding:.8rem .8rem 1rem;box-shadow:0 0 36px rgba(76,123,255,.35);pointer-events:auto;display:flex;flex-direction:column;align-items:center}
.wincard .winbean{width:160px;height:160px;filter:drop-shadow(0 0 18px #ff5fd2);animation:beanPop .7s ease both}
.wintitle{font-size:1.55rem;font-weight:800;margin:.35rem 0 .5rem;letter-spacing:.03em;background:linear-gradient(90deg,#4c7bff,#ff5fd2);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.recipe{width:100%;text-align:left;background:rgba(16,20,36,.9);border:1px solid rgba(76,123,255,.3);border-radius:12px;padding:.65rem .7rem;font-size:.92rem;line-height:1.35;margin-bottom:.4rem}
.recipe .rtitle{font-weight:700;color:#f0c14e;margin-bottom:.3rem;font-size:1.05rem}
body.ingame #app .wincard,body.ingame #app .wincard *{pointer-events:auto}
body.won #pad,body.won.ingame.player #pad{display:none!important}
body.won #mute,body.won.ingame #mute{display:none!important}
body.lobby h1,body.lobby .inroom,body.lobby .player-list,body.lobby .player-item,body.lobby #app>div{text-shadow:0 2px 8px #000,0 0 14px rgba(0,0,0,.8)}
.rounds{display:flex;align-items:center;justify-content:center;gap:.35rem;flex-wrap:wrap;margin:.35rem 0 .15rem}
.rounds .lab{font-size:.95rem;color:#cde;margin-right:.15rem}
.rounds button{min-width:48px;width:48px;min-height:44px;padding:0;margin:0;font-weight:600}
.rounds button.on{background:linear-gradient(90deg,#4c7bff,#ff5fd2);border:0;box-shadow:0 0 16px rgba(255,95,210,.4)}
.rounds-read{font-size:1.05rem;color:#dde;margin:.3rem 0}
</style>
</head>
<body>
<div id="app"></div>
<div class="connecting" id="connecting">Connecting...</div>
<canvas id="gameCanvas"></canvas>
<canvas id="pileCanvas"></canvas>
<div id="pad"><button id="tl" aria-label="Turn left">&#9664;</button><button id="tr" aria-label="Turn right">&#9654;</button></div>
<button id="mute" aria-label="Sound">&#128266;</button>
<script src="/audio.js"></script>
<script src="/recipes.js"></script>
<script>
(() => {
    const BEANS = [
        {name:"Lima",color:"#b8e04a"},
        {name:"Coffee",color:"#c8875a"},
        {name:"Navy",color:"#4c7bff"},
        {name:"Kidney",color:"#ff4d4d"},
        {name:"Pinto",color:"#f0c14e"},
        {name:"Jelly",color:"#ff5fd2"},
        {name:"Mung",color:"#2ee59a"},
        {name:"Black",color:"#e8e8e8"}
    ];
    const app = document.getElementById('app');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let ws, wsOpen = false, reconnectTimer = null;
    let lobby = null; // latest lobby message
    let state = null; // latest state message
    let screen = 'home'; // home, picker, lobby, spectator, game
    let youId = null;
    let adminId = null;
    let lastTouch = null;
    let topList = [];
    let winHold=false, winDismissed=false, winRecipe=null, winBean=0;
    const BIMG = BEANS.map(b=>{ const i=new Image(); i.src='/beans/'+b.name.toLowerCase()+'.png'; return i; });
    function beanImg(i,size){ const im=document.createElement('img'); im.src='/beans/'+BEANS[i].name.toLowerCase()+'.png'; im.alt=BEANS[i].name; im.className='beanimg'; im.style.width=size+'px'; im.style.height=size+'px'; return im; }
    const BWPile = (() => {
        const el = document.getElementById('pileCanvas');
        const ctx = el.getContext('2d', { alpha: true });
        const frozen = document.createElement('canvas');
        const fctx = frozen.getContext('2d');
        const MAX = 300, G = 2200;
        let on = false, raf = 0, t0 = 0, nextSpawn = 0, frozenN = 0;
        let W = 0, H = 0, dpr = 1, surf = null, live = [];
        function drawBean(c, b) {
            c.save(); c.translate(b.x, b.y); c.rotate(b.rot);
            if (b.im && b.im.complete && b.im.naturalWidth) c.drawImage(b.im, -b.w/2, -b.h/2, b.w, b.h);
            else { c.fillStyle = b.col; c.beginPath(); c.ellipse(0, 0, b.w*0.45, b.h*0.35, 0, 0, Math.PI*2); c.fill(); }
            c.restore();
        }
        function at(x) { return surf[Math.max(0, Math.min(W-1, x|0))]; }
        function size() {
            const w = window.innerWidth, h = window.innerHeight;
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            W = w; H = h;
            el.width = frozen.width = (w * dpr) | 0;
            el.height = frozen.height = (h * dpr) | 0;
            el.style.width = w + 'px'; el.style.height = h + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            surf = new Float32Array(W); surf.fill(H - 4);
            live.length = 0; frozenN = 0;
            fctx.clearRect(0, 0, W, H); ctx.clearRect(0, 0, W, H);
        }
        function stamp(b) {
            drawBean(fctx, b);
            const rx = b.w * 0.48, ry = b.h * 0.38;
            const x0 = Math.max(0, (b.x - rx) | 0), x1 = Math.min(W - 1, (b.x + rx) | 0);
            for (let x = x0; x <= x1; x++) {
                const n = (x - b.x) / rx;
                const top = b.y - ry * Math.sqrt(Math.max(0, 1 - n * n));
                if (top < surf[x]) surf[x] = top;
            }
            frozenN++;
        }
        function spawn() {
            if (frozenN + live.length >= MAX || live.length >= 32) return;
            const i = (Math.random() * 8) | 0;
            const s = 0.22 + Math.random() * 0.1;
            const w = 128 * s, h = 128 * s;
            live.push({
                x: 18 + Math.random() * Math.max(1, W - 36), y: -24 - Math.random() * 70,
                vx: (Math.random() - 0.5) * 70, vy: 30 + Math.random() * 90,
                rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 5,
                w, h, r: Math.min(w, h) * 0.36, im: BIMG[i], col: BEANS[i].color
            });
        }
        function step(dt) {
            for (let i = live.length - 1; i >= 0; i--) {
                const b = live[i];
                b.vy += G * dt; b.vx *= 0.995;
                b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
                if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx) * 0.4; }
                if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx) * 0.4; }
                const sy = Math.min(at(b.x), at(b.x - b.r * 0.65), at(b.x + b.r * 0.65));
                if (b.y + b.r >= sy) {
                    const sl = at(b.x + 3) - at(b.x - 3);
                    b.y = sy - b.r;
                    if (b.vy > 130) {
                        b.vy *= -0.24; b.vx = b.vx * 0.65 + sl * 10 + (Math.random() - 0.5) * 18;
                        b.vr += (Math.random() - 0.5) * 6;
                    } else {
                        stamp(b); live.splice(i, 1);
                    }
                }
            }
        }
        function frame(now) {
            if (!on) return;
            if (!t0) t0 = now;
            const dt = Math.min(0.032, (now - t0) / 1000);
            t0 = now;
            if (frozenN < MAX && now >= nextSpawn) {
                spawn();
                nextSpawn = now + 250 + Math.random() * 250;
            }
            step(dt);
            ctx.clearRect(0, 0, W, H);
            ctx.drawImage(frozen, 0, 0, W, H);
            for (let i = 0; i < live.length; i++) drawBean(ctx, live[i]);
            raf = requestAnimationFrame(frame);
        }
        function onResize() { if (on) size(); }
        return {
            start() {
                if (on) return;
                on = true; t0 = 0; nextSpawn = 0; size();
                window.addEventListener('resize', onResize);
                raf = requestAnimationFrame(frame);
            },
            stop() {
                if (!on && !frozenN && !live.length) return;
                on = false;
                if (raf) cancelAnimationFrame(raf);
                raf = 0; t0 = 0; live.length = 0; frozenN = 0;
                window.removeEventListener('resize', onResize);
                if (W) { fctx.clearRect(0, 0, W, H); ctx.clearRect(0, 0, W, H); if (surf) surf.fill(H - 4); }
            }
        };
    })();
    // ---------- WebSocket ----------
    function connect() {
        const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
        ws = new WebSocket(proto + location.host + '/ws');
        ws.binaryType = 'arraybuffer';
        ws.onopen = () => { wsOpen = true; document.getElementById('connecting').style.display='none'; };
        ws.onclose = () => {
            wsOpen = false;
            document.getElementById('connecting').style.display='block';
            reconnectTimer = setTimeout(connect,1500);
        };
        ws.onmessage = e => {
            const msg = JSON.parse(e.data);
            if (msg.t === 'lobby') {
                lobby = msg;
                youId = msg.you;
                adminId = msg.admin;
                if (winHold) return;
                if (youId===null && screen==='top') {}
                else if (youId===null && msg.phase==='lobby') screen=(screen==='picker'?'picker':'home');
                else if (youId===null && msg.phase==='playing') screen='spectator';
                else screen='lobby';
                render();
            } else if (msg.t === 'state') {
                if (winDismissed && msg.phase==='match-end') { state=msg; return; }
                if (msg.phase==='match-end' && (!state || state.phase!=='match-end') && msg.matchWinner===youId) {
                    winHold=true; winDismissed=false;
                    winBean=msg.matchWinner-1;
                    const key=BEANS[winBean] && BEANS[winBean].name.toLowerCase();
                    const list=(window.BW_RECIPES && key && BW_RECIPES[key]) || [];
                    winRecipe=list.length ? list[Math.floor(Math.random()*list.length)] : null;
                    if (window.BWA) BWA.great();
                }
                if (state && state.riders) {
                    for (const r of msg.riders) {
                        const pr = state.riders.find(x=>x.id===r.id);
                        if (pr && pr.alive && !r.alive) {
                            spawnSparks(r.x, r.y, BEANS[r.id-1].color);
                            shake = Math.max(shake, 7);
                        }
                    }
                }
                if (window.BWA) BWA.onState(state, msg, youId);
                state = msg;
                if (youId===null && screen==='top') return;
                screen = (youId===null) ? 'spectator' : 'game';
                render();
            } else if (msg.t === 'top') {
                topList = msg.list || [];
                if (screen==='top') render();
            }
        };
    }
    connect();
    // ---------- Rendering ----------
    function clearApp() { app.innerHTML=''; }
    let loop=false;
    let stars=null, sparks=[], shake=0;
    let nameVal = localStorage.getItem('bw-name') || '';
    function render() {
        document.body.classList.toggle('won', winHold);
        document.body.classList.toggle('top', screen==='top');
        if (winHold && app.querySelector('.wincard')) return;
        const ae=document.activeElement, refocus = ae && ae.id==='nameIn', caret = refocus ? ae.selectionStart : 0;
        clearApp();
        const g = screen==='game'||(screen==='spectator'&&state);
        if (g && !document.body.classList.contains('ingame')) { document.body.classList.add('ingame'); resizeCanvas(); }
        if (!g) document.body.classList.remove('ingame');
        document.body.classList.toggle('player', screen==='game');
        if (g && !loop) { loop=true; requestAnimationFrame(draw); }
        if (screen==='home') renderHome();
        else if (screen==='picker') renderPicker();
        else if (screen==='lobby') renderLobby();
        else if (screen==='spectator') renderSpectator();
        else if (screen==='game') renderGame();
        else if (screen==='top') renderTop();
        document.body.classList.toggle('home', screen==='home');
        document.body.classList.toggle('lobby', screen==='lobby');
        if (screen==='lobby') BWPile.start(); else BWPile.stop();
        const ni=document.getElementById('nameIn'); if (ni && refocus) { ni.focus(); ni.setSelectionRange(caret,caret); }
    }
    function label(p){ return (p.name||BEANS[p.bean].name) + ' (' + BEANS[p.bean].name + ')'; }
    function nameBox() {
        const w=document.createElement('div'); w.className='namebox';
        const nl=document.createElement('div'); nl.textContent='Your name'; nl.className='namelabel';
        const ni=document.createElement('input'); ni.id='nameIn'; ni.maxLength=14; ni.placeholder='Type your name'; ni.value=nameVal; ni.autocomplete='off'; ni.enterKeyHint='done';
        ni.oninput=()=>{ nameVal=ni.value; localStorage.setItem('bw-name',nameVal); ni.classList.remove('need'); };
        w.appendChild(nl); w.appendChild(ni); return w;
    }
    function playerList() {
        const list=document.createElement('div'); list.className='player-list';
        const ps=(lobby&&lobby.players)||[];
        const h=document.createElement('div'); h.className='inroom'; h.textContent=ps.length?('In the room ('+ps.length+'/8)'):'No one in the room yet';
        list.appendChild(h);
        ps.forEach(p=>{
            const item=document.createElement('div'); item.className='player-item';
            const dot=beanImg(p.bean,26); dot.style.marginRight='.5rem'; dot.style.filter='drop-shadow(0 0 4px '+BEANS[p.bean].color+')';
            item.appendChild(dot);
            let txt=label(p); if (p.id===adminId) txt+=' (Admin)'; if (p.id===youId) txt+=' (you)';
            item.appendChild(document.createTextNode(txt)); list.appendChild(item);
        });
        return list;
    }
    function renderHome() {
        app.appendChild(nameBox());
        const sp=document.createElement('div'); sp.style.flex='1'; app.appendChild(sp);
        const panel=document.createElement('div'); panel.className='panel';
        panel.appendChild(playerList());
        const btn=document.createElement('button'); btn.className='big'; btn.textContent='Join';
        btn.onclick=()=>{
            if (!nameVal.trim()) { const n=document.getElementById('nameIn'); n.classList.add('need'); n.placeholder='Type your name first'; n.focus(); return; }
            if (window.BWA) BWA.welcome(); screen='picker'; render();
        };
        const tb=document.createElement('button'); tb.textContent='Top 20'; tb.onclick=()=>{ screen='top'; render(); };
        panel.appendChild(btn); panel.appendChild(tb);
        app.appendChild(panel);
    }
    function renderTop() {
        const h=document.createElement('h1'); h.className='toptitle'; h.textContent='Top 20'; app.appendChild(h);
        if (topList.length) {
            const pod=document.createElement('div'); pod.className='podium';
            const places=topList.slice(0,3);
            // render gold in the middle: add in 2,1,3 visual order via CSS order
            const order=[places[1],places[0],places[2]];
            const labels=[2,1,3];
            order.forEach((e,j)=>{
                if (!e) return;
                const rank=labels[j];
                const spot=document.createElement('div'); spot.className='spot s'+rank;
                const pl=document.createElement('div'); pl.className='place'; pl.textContent=['','1st','2nd','3rd'][rank];
                if (e.bean>=0 && e.bean<BEANS.length) { const im=beanImg(e.bean, rank===1?64:48); im.style.margin='0 auto .15rem'; im.style.filter='drop-shadow(0 0 6px '+BEANS[e.bean].color+')'; spot.appendChild(im); }
                const nm=document.createElement('div'); nm.className='pname'; nm.textContent=e.name;
                const st=document.createElement('div'); st.className='pstat'; st.textContent=e.wins+' win'+(e.wins===1?'':'s');
                spot.appendChild(pl); spot.appendChild(nm); spot.appendChild(st);
                pod.appendChild(spot);
            });
            app.appendChild(pod);
        }
        const t=document.createElement('div'); t.className='toplist';
        if (!topList.length) { t.textContent='No finished games yet.'; t.style.textAlign='center'; t.style.padding='1rem'; }
        else {
            const hd=document.createElement('div'); hd.className='row hd';
            ['#','','Name','Wins','Games','Win %'].forEach(v=>{ const sp=document.createElement('span'); sp.textContent=v; hd.appendChild(sp); });
            t.appendChild(hd);
            topList.forEach((e,i)=>{
                const row=document.createElement('div'); row.className='row'+(i<3?' r'+(i+1):'');
                row.style.animationDelay=(i*0.04)+'s';
                const rank=document.createElement('span'); rank.textContent=String(i+1); row.appendChild(rank);
                const ic=document.createElement('span');
                if (e.bean>=0 && e.bean<BEANS.length) { const im=beanImg(e.bean,22); im.style.filter='drop-shadow(0 0 4px '+BEANS[e.bean].color+')'; ic.appendChild(im); }
                row.appendChild(ic);
                const nm=document.createElement('span'); nm.textContent=e.name; row.appendChild(nm);
                const wr=e.games?Math.round(e.wins/e.games*100)+'%':'0%';
                [String(e.wins),String(e.games),wr].forEach(v=>{ const sp=document.createElement('span'); sp.textContent=v; row.appendChild(sp); });
                t.appendChild(row);
            });
        }
        app.appendChild(t);
        const note=document.createElement('div'); note.className='namelabel'; note.textContent='Ranked by match wins. Games against the AI count too.'; app.appendChild(note);
        const back=document.createElement('button'); back.textContent='Back';
        back.onclick=()=>{ screen = youId!==null ? 'lobby' : (lobby&&lobby.phase==='playing' ? 'spectator':'home'); if (screen!=='home' && youId!==null && state && lobby.phase==='playing') screen='game'; render(); };
        app.appendChild(back);
    }
    function renderPicker() {
        const title=document.createElement('h1');
        title.textContent='Select Your Bean';
        app.appendChild(nameBox());
        app.appendChild(title);
        const grid=document.createElement('div');
        grid.style.display='grid';
        grid.style.gridTemplateColumns='repeat(2,1fr)';
        grid.style.gap='0.5rem';
        BEANS.forEach((b,i)=>{
            const taken = lobby && lobby.players.some(p=>p.bean===i);
            const btn=document.createElement('button');
            btn.className='bean-btn';
            btn.disabled=taken;
            const shape=beanImg(i,64);
            if (taken) shape.style.filter='grayscale(1) brightness(.5)';
            btn.style.borderBottom='4px solid '+(taken?'#555':b.color);
            btn.appendChild(shape);
            btn.appendChild(document.createTextNode(b.name));
            if (taken) {
                const takenLabel=document.createElement('div');
                takenLabel.style.fontSize='0.8rem';
                takenLabel.style.color='#aaa';
                takenLabel.textContent='Taken';
                btn.appendChild(takenLabel);
            } else {
                btn.onclick=()=>{ if(!nameVal.trim()){ const n=document.getElementById('nameIn'); n.focus(); n.placeholder='Type your name first'; return; } send({t:'join',bean:i,name:nameVal.trim()}); };
            }
            grid.appendChild(btn);
        });
        app.appendChild(grid);
        const back=document.createElement('button');
        back.textContent='Back';
        back.onclick=()=>{ screen='home'; render(); };
        app.appendChild(back);
    }
    function renderLobby() {
        const you = lobby.players.find(p=>p.id===youId);
        const title=document.createElement('h1');
        title.textContent=`You are ${BEANS[you.bean].name}`;
        title.style.color=BEANS[you.bean].color;
        app.appendChild(title);
        app.appendChild(playerList());
        const ROPTS=[1,3,5,7];
        const cur=ROPTS.includes(lobby.rounds)?lobby.rounds:3;
        if (youId===adminId) {
            const row=document.createElement('div'); row.className='rounds';
            const lab=document.createElement('span'); lab.className='lab'; lab.textContent='Rounds'; row.appendChild(lab);
            ROPTS.forEach(n=>{
                const b=document.createElement('button'); b.textContent=String(n);
                if (n===cur) b.className='on';
                b.setAttribute('aria-label', n+' rounds');
                b.onclick=()=>{ if (n!==cur) send({t:'rounds',n}); };
                row.appendChild(b);
            });
            app.appendChild(row);
            const startBtn=document.createElement('button');
            startBtn.className='big';
            startBtn.textContent='Start';
            startBtn.onclick=()=>{ BWPile.stop(); send({t:'start'}); };
            app.appendChild(startBtn);
            const note=document.createElement('div');
            note.style.fontSize='0.9rem';
            note.style.marginTop='0.3rem';
            note.textContent='Start now or wait for more players. If you start alone, an AI bean joins.';
            app.appendChild(note);
        } else {
            const rd=document.createElement('div'); rd.className='rounds-read'; rd.textContent='Rounds: '+cur; app.appendChild(rd);
            const wait=document.createElement('div');
            wait.textContent='Waiting for the admin to start';
            wait.style.fontSize='1.1rem';
            app.appendChild(wait);
        }
        const leave=document.createElement('button');
        leave.textContent='Leave';
        leave.style.marginTop='1rem';
        leave.onclick=()=>{ send({t:'leave'}); };
        app.appendChild(leave);
        const tb=document.createElement('button'); tb.textContent='Top 20'; tb.onclick=()=>{ screen='top'; render(); }; app.appendChild(tb);
    }
    function renderSpectator() {
        const note=document.createElement('div');
        note.textContent='Game in progress. You can join when it ends.';
        note.style.fontSize='1.2rem';
        app.appendChild(note);
        const tb=document.createElement('button'); tb.textContent='Top 20'; tb.style.pointerEvents='auto'; tb.onclick=()=>{ screen='top'; render(); }; app.appendChild(tb);
    }
    function renderGame() {
        // HUD
        const topBar=document.createElement('div');
        topBar.className='top-bar';
        const roundInfo=document.createElement('div');
        roundInfo.textContent=`Round ${state.round}/${state.rounds}`;
        topBar.appendChild(roundInfo);
        state.riders.forEach(r=>{
            const span=document.createElement('span');
            span.textContent=`${r.name}:${r.score}`;
            span.style.color=BEANS[r.id-1].color;
            if (!r.alive) span.style.opacity='0.4';
            if (r.id===youId) span.textContent+=` (you)`;
            topBar.appendChild(span);
        });
        app.appendChild(topBar);
        // Overlay
        const overlay=document.createElement('div');
        overlay.className='overlay';
        if (state.phase==='countdown') overlay.textContent=state.wait;
        else if (state.phase==='round-end') {
            if (state.winner) overlay.textContent=`${(state.riders.find(r=>r.id===state.winner)||{name:''}).name} wins the round`;
            else overlay.textContent='Draw';
        } else if (state.phase==='match-end') {
            if (winHold && state.matchWinner===youId) {
                const card=document.createElement('div'); card.className='wincard';
                const im=beanImg(winBean,160); im.className='beanimg winbean';
                im.style.filter='drop-shadow(0 0 18px '+(BEANS[winBean]||BEANS[0]).color+')';
                const title=document.createElement('div'); title.className='wintitle'; title.textContent="You've Bean Great!";
                card.appendChild(im); card.appendChild(title);
                if (winRecipe) {
                    const box=document.createElement('div'); box.className='recipe';
                    const rt=document.createElement('div'); rt.className='rtitle'; rt.textContent=winRecipe.title;
                    box.appendChild(rt);
                    (winRecipe.lines||[]).forEach(line=>{ const p=document.createElement('div'); p.textContent=line; box.appendChild(p); });
                    card.appendChild(box);
                }
                const go=document.createElement('button'); go.className='big'; go.textContent='Continue';
                go.onclick=()=>{ winHold=false; winDismissed=true; winRecipe=null; document.body.classList.remove('won','ingame'); screen = youId!==null ? 'lobby' : 'home'; render(); };
                card.appendChild(go);
                app.appendChild(card);
                return;
            }
            if (state.matchWinner) overlay.textContent=`${(state.riders.find(r=>r.id===state.matchWinner)||{name:''}).name} wins Beanwars!`;
            else overlay.textContent='Draw';
            const sub=document.createElement('div');
            sub.style.fontSize='1rem';
            sub.textContent='Back to lobby shortly';
            overlay.appendChild(sub);
        }
        if (state.phase==='countdown') {
            const hint=document.createElement('div');
            hint.className='hint';
            hint.textContent='Swipe to steer, or tap left/right to turn';
            app.appendChild(hint);
        }
        app.appendChild(overlay);

    }
    // ---------- Canvas ----------
    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    window.addEventListener('resize',resizeCanvas);
    // ---------- Drawing ----------
    function spawnSparks(x,y,col){
        for(let i=0;i<14 && sparks.length<40;i++){
            const a=Math.random()*Math.PI*2, sp=0.08+Math.random()*0.22;
            sparks.push({x:x+0.5,y:y+0.5,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,col});
        }
    }
    function draw() {
        if (!document.body.classList.contains('ingame') || !state) { loop=false; return; }
        const {cols,rows,grid,minX,minY,maxX,maxY} = state;
        const W=window.innerWidth, H=window.innerHeight, top=70, bot=84;
        const cell=Math.min(W/cols,(H-top-bot)/rows), cellW=cell, cellH=cell;
        const now=performance.now();
        if (!stars) stars=Array.from({length:48},()=>({x:Math.random(),y:Math.random(),z:0.15+Math.random()*0.85,tw:Math.random()*6.28}));
        ctx.fillStyle = '#07080d';
        ctx.fillRect(0,0,W,H);
        const drift=(now/90000);
        for (const s of stars){
            let sx=(s.x+drift*s.z)%1, sy=(s.y+drift*s.z*0.4)%1;
            if (sx<0) sx+=1; if (sy<0) sy+=1;
            const a=0.2+0.45*s.z*(0.55+0.45*Math.sin(now/450+s.tw));
            ctx.fillStyle=`rgba(170,200,255,${a})`;
            const sz=s.z<0.45?1:1.5;
            ctx.fillRect(sx*W,sy*H,sz,sz);
        }
        ctx.save();
        if (shake>0){
            ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
            shake*=0.82;
            if (shake<0.25) shake=0;
        }
        ctx.translate((W-cols*cell)/2, top+((H-top-bot)-rows*cell)/2);
        const pulse=0.045+0.04*(0.5+0.5*Math.sin(now/900));
        ctx.strokeStyle = `rgba(120,170,255,${pulse})`;
        ctx.lineWidth = 0.5;
        for(let c=0;c<=cols;c++){
            ctx.beginPath();
            ctx.moveTo(c*cellW,0);
            ctx.lineTo(c*cellW,rows*cellH);
            ctx.stroke();
        }
        for(let r=0;r<=rows;r++){
            ctx.beginPath();
            ctx.moveTo(0,r*cellH);
            ctx.lineTo(cols*cellW,r*cellH);
            ctx.stroke();
        }
        // Decode grid
        const data = Uint8Array.from(atob(grid),c=>c.charCodeAt(0));
        // Draw cells
        for(let y=0;y<rows;y++){
            for(let x=0;x<cols;x++){
                const v = data[y*cols+x];
                if (v===0) continue;
                const px = x*cellW, py = y*cellH;
                if (v===255){
                    ctx.fillStyle = '#2a2f3a';
                    ctx.fillRect(px,py,cellW,cellH);
                } else {
                    const col = BEANS[v-1].color;
                    ctx.fillStyle = dimColor(col,0.5);
                    ctx.fillRect(px,py,cellW,cellH);
                }
            }
        }
        // Arena bounds
        const glow=0.45+0.35*(0.5+0.5*Math.sin(now/700));
        ctx.strokeStyle = `rgba(90,210,255,${0.4+glow*0.45})`;
        ctx.lineWidth = 2;
        ctx.strokeRect(minX*cellW, minY*cellH, (maxX-minX+1)*cellW, (maxY-minY+1)*cellH);
        ctx.strokeStyle = `rgba(255,95,210,${0.12+glow*0.12})`;
        ctx.lineWidth = 4;
        ctx.strokeRect(minX*cellW, minY*cellH, (maxX-minX+1)*cellW, (maxY-minY+1)*cellH);
        // Riders heads
        state.riders.forEach(r=>{
            if (!r.alive) return;
            const cx = (r.x+0.5)*cellW;
            const cy = (r.y+0.5)*cellH;
            const sz = cellW*2.8, col = BEANS[r.id-1].color, im = BIMG[r.id-1];
            ctx.save();
            ctx.translate(cx,cy);
            ctx.beginPath(); ctx.arc(0,0,sz*0.42,0,2*Math.PI);
            ctx.fillStyle = col+'40'; ctx.shadowColor = col; ctx.shadowBlur = 14; ctx.fill();
            ctx.shadowBlur = 0;
            ctx.rotate(r.dir*Math.PI/2 + Math.PI/2);
            if (im.complete && im.naturalWidth) ctx.drawImage(im,-sz/2,-sz/2,sz,sz);
            else { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0,0,cellW*0.4,cellH*0.3,0,0,2*Math.PI); ctx.fill(); }
            ctx.restore();
        });
        for (let i=sparks.length-1;i>=0;i--){
            const p=sparks[i];
            p.x+=p.vx; p.y+=p.vy; p.life-=0.028;
            if (p.life<=0){ sparks.splice(i,1); continue; }
            ctx.globalAlpha=Math.max(0,p.life);
            ctx.fillStyle=p.col;
            ctx.fillRect(p.x*cellW-1.2, p.y*cellH-1.2, 2.4, 2.4);
            ctx.globalAlpha=1;
        }
        ctx.restore();
        const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.28,W/2,H/2,Math.max(W,H)*0.72);
        vg.addColorStop(0,'rgba(0,0,0,0)');
        vg.addColorStop(1,'rgba(0,0,0,0.58)');
        ctx.fillStyle=vg;
        ctx.fillRect(0,0,W,H);
        requestAnimationFrame(draw);
    }
    function dimColor(hex, factor){
        const r = Math.round(parseInt(hex.slice(1,3),16)*factor);
        const g = Math.round(parseInt(hex.slice(3,5),16)*factor);
        const b = Math.round(parseInt(hex.slice(5,7),16)*factor);
        return `rgb(${r},${g},${b})`;
    }
    // ---------- Input ----------
    for (const [id,d] of [['tl',-1],['tr',1]]) document.getElementById(id).addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();send({t:'turn',d});});
    function send(msg){ if(wsOpen) ws.send(JSON.stringify(msg)); }
    // Keyboard
    window.addEventListener('keydown',e=>{
        if(screen!=='game') return;
        const map = {ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
        if(map[e.code]!==undefined){
            e.preventDefault();
            send({t:'aim',dir:map[e.code]});
        }
    });
    // Touch
    canvas.addEventListener('touchstart',e=>{
        if(screen!=='game') return;
        const t = e.touches[0];
        lastTouch={x:t.clientX,y:t.clientY,time:Date.now()};
    });
    canvas.addEventListener('touchend',e=>{
        if(screen!=='game' || !lastTouch) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - lastTouch.x;
        const dy = t.clientY - lastTouch.y;
        const dt = Date.now() - lastTouch.time;
        const dist = Math.hypot(dx,dy);
        if(dist>20 && dt<500){
            // swipe
            const absX = Math.abs(dx), absY = Math.abs(dy);
            let dir;
            if(absX>absY){
                dir = dx>0?1:3; // right or left
            }else{
                dir = dy>0?2:0; // down or up
            }
            send({t:'aim',dir});
        }else{
            // tap left/right
            const half = canvas.clientWidth/2;
            const d = (t.clientX<half)?-1:1;
            send({t:'turn',d});
        }
        lastTouch=null;
    });
    // Prevent scrolling
    document.body.addEventListener('touchmove',e=>{ if(screen==='game') e.preventDefault(); },{passive:false});
})();
</script>
