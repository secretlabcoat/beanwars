<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BEANWARS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
html,body{margin:0;padding:0;height:100%;background:#0b0d12;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
#app{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1{font-size:3rem;margin:0.5rem}
button{min-height:52px;padding:0 1rem;font-size:1.2rem;border:none;border-radius:8px;background:#222;color:#fff;margin:0.5rem;cursor:pointer}
button:disabled{background:#555;cursor:default}
.bean-btn{display:flex;flex-direction:column;align-items:center;justify-content:center}
.bean-shape{width:80px;height:40px;border-radius:40px/20px;margin-bottom:0.3rem}
.player-list{display:flex;flex-direction:column;align-items:center;margin:1rem 0}
.player-item{display:flex;align-items:center;margin:0.2rem 0}
.dot{width:14px;height:14px;border-radius:50%;margin-right:0.5rem}
.top-bar{position:absolute;top:0;left:0;width:100%;padding:0.5rem;background:rgba(0,0,0,0.5);display:flex;flex-wrap:wrap;justify-content:center;gap:0.5rem;font-size:0.9rem;z-index:2}
.overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2rem;pointer-events:none;z-index:2}
.hint{position:absolute;top:calc(100% - 2rem);left:50%;transform:translateX(-50%);font-size:0.9rem;color:#aaa;z-index:2}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;touch-action:none;z-index:0;display:none}
#app{z-index:1}
#pad{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:none;justify-content:space-between;padding:0 16px;z-index:3;pointer-events:none}
#pad button{pointer-events:auto;min-width:64px;width:64px;height:52px;padding:0;font-size:1.3rem;opacity:.85;touch-action:none}
body.ingame.player #pad{display:flex}
.hint{display:none}
body.ingame #app{pointer-events:none}
body.ingame canvas{display:block}
.connecting{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.5rem;color:#aaa;z-index:3}
button{min-height:52px;min-width:120px;font-size:1.2rem;padding:0 1.4rem;border-radius:12px;border:0;background:#232836;color:#fff}
.bean-btn{min-width:130px;min-height:100px}
.beanimg{object-fit:contain;display:block}
h1{font-size:3rem;letter-spacing:.08em}
#nameIn{font-size:1.2rem;padding:.7rem 1rem;border-radius:12px;border:1px solid #333;background:#161a23;color:#fff;width:240px;text-align:center;margin-bottom:.3rem}
#mute{position:fixed;top:calc(6px + env(safe-area-inset-top));right:8px;z-index:4;min-width:44px;width:44px;height:44px;padding:0;font-size:1.1rem;opacity:.8}
body.ingame #mute{top:auto;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;right:auto;transform:translateX(-50%)}
body.home{background:#05030f url(/title.jpg) center top/100% auto no-repeat}
body.home #app{justify-content:flex-start}
.namebox{margin-top:calc(10px + env(safe-area-inset-top));background:rgba(5,3,15,.75);padding:.2rem .8rem .5rem;border-radius:14px;display:flex;flex-direction:column;align-items:center;z-index:2}
.namelabel{font-size:.9rem;color:#bbb;margin:.3rem 0}
#nameIn{background:rgba(10,12,20,.85);border:2px solid #4c7bff}
#nameIn.need{border-color:#ff4d4d}
.panel{width:100%;padding:1rem 0 calc(1.2rem + env(safe-area-inset-bottom));background:linear-gradient(to bottom,rgba(5,3,15,0),rgba(5,3,15,.92) 25%);display:flex;flex-direction:column;align-items:center}
.panel .player-list{margin:.4rem 0}
.inroom{font-size:.95rem;color:#ccc;margin-bottom:.2rem}
button.big{min-width:200px;font-size:1.5rem;background:linear-gradient(90deg,#4c7bff,#ff5fd2);font-weight:700;letter-spacing:.05em}
.toplist{width:min(92vw,420px);max-height:60vh;overflow:auto;background:#121621;border-radius:12px;padding:.5rem}
.toplist .row{display:grid;grid-template-columns:2rem 1fr 3.5rem 3.5rem;padding:.35rem .4rem;border-bottom:1px solid #222;text-align:left}
.toplist .row span:nth-child(n+3){text-align:right}
.toplist .hd{color:#999;font-size:.85rem}
</style>
</head>
<body>
<div id="app"></div>
<div class="connecting" id="connecting">Connecting...</div>
<canvas id="gameCanvas"></canvas>
<div id="pad"><button id="tl" aria-label="Turn left">&#9664;</button><button id="tr" aria-label="Turn right">&#9654;</button></div>
<button id="mute" aria-label="Sound">&#128266;</button>
<script src="/audio.js"></script>
<script>
(() => {
    const BEANS = [
        {name:"Lima",color:"#b8e04a"},
        {name:"Coffee",color:"#c8875a"},
        {name:"Navy",color:"#4c7bff"},
        {name:"Kidney",color:"#ff4d4d"},
        {name:"Pinto",color:"#f0c14e"},
        {name:"Jelly",color:"#ff5fd2"},
        {name:"Mung",color:"#2ee59a"},
        {name:"Black",color:"#e8e8e8"}
    ];
    const app = document.getElementById('app');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let ws, wsOpen = false, reconnectTimer = null;
    let lobby = null; // latest lobby message
    let state = null; // latest state message
    let screen = 'home'; // home, picker, lobby, spectator, game
    let youId = null;
    let adminId = null;
    let lastTouch = null;
    let topList = [];
    const BIMG = BEANS.map(b=>{ const i=new Image(); i.src='/beans/'+b.name.toLowerCase()+'.png'; return i; });
    function beanImg(i,size){ const im=document.createElement('img'); im.src='/beans/'+BEANS[i].name.toLowerCase()+'.png'; im.alt=BEANS[i].name; im.className='beanimg'; im.style.width=size+'px'; im.style.height=size+'px'; return im; }
    // ---------- WebSocket ----------
    function connect() {
        const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
        ws = new WebSocket(proto + location.host + '/ws');
        ws.binaryType = 'arraybuffer';
        ws.onopen = () => { wsOpen = true; document.getElementById('connecting').style.display='none'; };
        ws.onclose = () => {
            wsOpen = false;
            document.getElementById('connecting').style.display='block';
            reconnectTimer = setTimeout(connect,1500);
        };
        ws.onmessage = e => {
            const msg = JSON.parse(e.data);
            if (msg.t === 'lobby') {
                lobby = msg;
                youId = msg.you;
                adminId = msg.admin;
                if (youId===null && screen==='top') {}
                else if (youId===null && msg.phase==='lobby') screen=(screen==='picker'?'picker':'home');
                else if (youId===null && msg.phase==='playing') screen='spectator';
                else screen='lobby';
                render();
            } else if (msg.t === 'state') {
                if (window.BWA) BWA.onState(state, msg, youId);
                state = msg;
                if (youId===null && screen==='top') return;
                screen = (youId===null) ? 'spectator' : 'game';
                render();
            } else if (msg.t === 'top') {
                topList = msg.list || [];
                if (screen==='top') render();
            }
        };
    }
    connect();
    // ---------- Rendering ----------
    function clearApp() { app.innerHTML=''; }
    let loop=false;
    let nameVal = localStorage.getItem('bw-name') || '';
    function render() {
        const ae=document.activeElement, refocus = ae && ae.id==='nameIn', caret = refocus ? ae.selectionStart : 0;
        clearApp();
        const g = screen==='game'||(screen==='spectator'&&state);
        if (g && !document.body.classList.contains('ingame')) { document.body.classList.add('ingame'); resizeCanvas(); }
        if (!g) document.body.classList.remove('ingame');
        document.body.classList.toggle('player', screen==='game');
        if (g && !loop) { loop=true; requestAnimationFrame(draw); }
        if (screen==='home') renderHome();
        else if (screen==='picker') renderPicker();
        else if (screen==='lobby') renderLobby();
        else if (screen==='spectator') renderSpectator();
        else if (screen==='game') renderGame();
        else if (screen==='top') renderTop();
        document.body.classList.toggle('home', screen==='home');
        const ni=document.getElementById('nameIn'); if (ni && refocus) { ni.focus(); ni.setSelectionRange(caret,caret); }
    }
    function label(p){ return (p.name||BEANS[p.bean].name) + ' (' + BEANS[p.bean].name + ')'; }
    function nameBox() {
        const w=document.createElement('div'); w.className='namebox';
        const nl=document.createElement('div'); nl.textContent='Your name'; nl.className='namelabel';
        const ni=document.createElement('input'); ni.id='nameIn'; ni.maxLength=14; ni.placeholder='Type your name'; ni.value=nameVal; ni.autocomplete='off'; ni.enterKeyHint='done';
        ni.oninput=()=>{ nameVal=ni.value; localStorage.setItem('bw-name',nameVal); ni.classList.remove('need'); };
        w.appendChild(nl); w.appendChild(ni); return w;
    }
    function playerList() {
        const list=document.createElement('div'); list.className='player-list';
        const ps=(lobby&&lobby.players)||[];
        const h=document.createElement('div'); h.className='inroom'; h.textContent=ps.length?('In the room ('+ps.length+'/8)'):'No one in the room yet';
        list.appendChild(h);
        ps.forEach(p=>{
            const item=document.createElement('div'); item.className='player-item';
            const dot=beanImg(p.bean,26); dot.style.marginRight='.5rem'; dot.style.filter='drop-shadow(0 0 4px '+BEANS[p.bean].color+')';
            item.appendChild(dot);
            let txt=label(p); if (p.id===adminId) txt+=' (Admin)'; if (p.id===youId) txt+=' (you)';
            item.appendChild(document.createTextNode(txt)); list.appendChild(item);
        });
        return list;
    }
    function renderHome() {
        app.appendChild(nameBox());
        const sp=document.createElement('div'); sp.style.flex='1'; app.appendChild(sp);
        const panel=document.createElement('div'); panel.className='panel';
        panel.appendChild(playerList());
        const btn=document.createElement('button'); btn.className='big'; btn.textContent='Join';
        btn.onclick=()=>{
            if (!nameVal.trim()) { const n=document.getElementById('nameIn'); n.classList.add('need'); n.placeholder='Type your name first'; n.focus(); return; }
            if (window.BWA) BWA.welcome(); screen='picker'; render();
        };
        const tb=document.createElement('button'); tb.textContent='Top 20'; tb.onclick=()=>{ screen='top'; render(); };
        panel.appendChild(btn); panel.appendChild(tb);
        app.appendChild(panel);
    }
    function renderTop() {
        const h=document.createElement('h1'); h.textContent='Top 20'; h.style.fontSize='2.2rem'; app.appendChild(h);
        const t=document.createElement('div'); t.className='toplist';
        if (!topList.length) { t.textContent='No finished games yet.'; t.style.textAlign='center'; }
        else {
            const hd=document.createElement('div'); hd.className='row hd'; hd.innerHTML='<span>#</span><span>Name</span><span>Wins</span><span>Games</span>'; t.appendChild(hd);
            topList.forEach((e,i)=>{
                const row=document.createElement('div'); row.className='row';
                [String(i+1),e.name,String(e.wins),String(e.games)].forEach(v=>{ const sp=document.createElement('span'); sp.textContent=v; row.appendChild(sp); });
                t.appendChild(row);
            });
        }
        app.appendChild(t);
        const note=document.createElement('div'); note.className='namelabel'; note.textContent='Ranked by match wins. Games against the AI count too.'; app.appendChild(note);
        const back=document.createElement('button'); back.textContent='Back';
        back.onclick=()=>{ screen = youId!==null ? 'lobby' : (lobby&&lobby.phase==='playing' ? 'spectator':'home'); if (screen!=='home' && youId!==null && state && lobby.phase==='playing') screen='game'; render(); };
        app.appendChild(back);
    }
    function renderPicker() {
        const title=document.createElement('h1');
        title.textContent='Select Your Bean';
        app.appendChild(nameBox());
        app.appendChild(title);
        const grid=document.createElement('div');
        grid.style.display='grid';
        grid.style.gridTemplateColumns='repeat(2,1fr)';
        grid.style.gap='0.5rem';
        BEANS.forEach((b,i)=>{
            const taken = lobby && lobby.players.some(p=>p.bean===i);
            const btn=document.createElement('button');
            btn.className='bean-btn';
            btn.disabled=taken;
            const shape=beanImg(i,64);
            if (taken) shape.style.filter='grayscale(1) brightness(.5)';
            btn.style.borderBottom='4px solid '+(taken?'#555':b.color);
            btn.appendChild(shape);
            btn.appendChild(document.createTextNode(b.name));
            if (taken) {
                const takenLabel=document.createElement('div');
                takenLabel.style.fontSize='0.8rem';
                takenLabel.style.color='#aaa';
                takenLabel.textContent='Taken';
                btn.appendChild(takenLabel);
            } else {
                btn.onclick=()=>{ if(!nameVal.trim()){ const n=document.getElementById('nameIn'); n.focus(); n.placeholder='Type your name first'; return; } send({t:'join',bean:i,name:nameVal.trim()}); };
            }
            grid.appendChild(btn);
        });
        app.appendChild(grid);
        const back=document.createElement('button');
        back.textContent='Back';
        back.onclick=()=>{ screen='home'; render(); };
        app.appendChild(back);
    }
    function renderLobby() {
        const you = lobby.players.find(p=>p.id===youId);
        const title=document.createElement('h1');
        title.textContent=`You are ${BEANS[you.bean].name}`;
        title.style.color=BEANS[you.bean].color;
        app.appendChild(title);
        app.appendChild(playerList());
        if (youId===adminId) {
            const startBtn=document.createElement('button');
            startBtn.textContent='Start';
            startBtn.style.fontSize='1.4rem';
            startBtn.onclick=()=>{ send({t:'start'}); };
            app.appendChild(startBtn);
            const note=document.createElement('div');
            note.style.fontSize='0.9rem';
            note.style.marginTop='0.3rem';
            note.textContent='Start now or wait for more players. If you start alone, an AI bean joins.';
            app.appendChild(note);
        } else {
            const wait=document.createElement('div');
            wait.textContent='Waiting for the admin to start';
            wait.style.fontSize='1.1rem';
            app.appendChild(wait);
        }
        const leave=document.createElement('button');
        leave.textContent='Leave';
        leave.style.marginTop='1rem';
        leave.onclick=()=>{ send({t:'leave'}); };
        app.appendChild(leave);
        const tb=document.createElement('button'); tb.textContent='Top 20'; tb.onclick=()=>{ screen='top'; render(); }; app.appendChild(tb);
    }
    function renderSpectator() {
        const note=document.createElement('div');
        note.textContent='Game in progress. You can join when it ends.';
        note.style.fontSize='1.2rem';
        app.appendChild(note);
        const tb=document.createElement('button'); tb.textContent='Top 20'; tb.style.pointerEvents='auto'; tb.onclick=()=>{ screen='top'; render(); }; app.appendChild(tb);
    }
    function renderGame() {
        // HUD
        const topBar=document.createElement('div');
        topBar.className='top-bar';
        const roundInfo=document.createElement('div');
        roundInfo.textContent=`Round ${state.round}/${state.rounds}`;
        topBar.appendChild(roundInfo);
        state.riders.forEach(r=>{
            const span=document.createElement('span');
            span.textContent=`${r.name}:${r.score}`;
            span.style.color=BEANS[r.id-1].color;
            if (!r.alive) span.style.opacity='0.4';
            if (r.id===youId) span.textContent+=` (you)`;
            topBar.appendChild(span);
        });
        app.appendChild(topBar);
        // Overlay
        const overlay=document.createElement('div');
        overlay.className='overlay';
        if (state.phase==='countdown') overlay.textContent=state.wait;
        else if (state.phase==='round-end') {
            if (state.winner) overlay.textContent=`${(state.riders.find(r=>r.id===state.winner)||{name:''}).name} wins the round`;
            else overlay.textContent='Draw';
        } else if (state.phase==='match-end') {
            if (state.matchWinner) overlay.textContent=`${(state.riders.find(r=>r.id===state.matchWinner)||{name:''}).name} wins Beanwars!`;
            else overlay.textContent='Draw';
            const sub=document.createElement('div');
            sub.style.fontSize='1rem';
            sub.textContent='Back to lobby shortly';
            overlay.appendChild(sub);
        }
        if (state.phase==='countdown') {
            const hint=document.createElement('div');
            hint.className='hint';
            hint.textContent='Swipe to steer, or tap left/right to turn';
            app.appendChild(hint);
        }
        app.appendChild(overlay);

    }
    // ---------- Canvas ----------
    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    window.addEventListener('resize',resizeCanvas);
    // ---------- Drawing ----------
    function draw() {
        if (!document.body.classList.contains('ingame') || !state) { loop=false; return; }
        const {cols,rows,grid,minX,minY,maxX,maxY} = state;
        const W=window.innerWidth, H=window.innerHeight, top=70, bot=84;
        const cell=Math.min(W/cols,(H-top-bot)/rows), cellW=cell, cellH=cell;
        ctx.save();
        ctx.fillStyle = '#0b0d12';
        ctx.fillRect(0,0,W,H);
        ctx.translate((W-cols*cell)/2, top+((H-top-bot)-rows*cell)/2);
        // Grid (optional faint)
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 0.5;
        for(let c=0;c<=cols;c++){
            ctx.beginPath();
            ctx.moveTo(c*cellW,0);
            ctx.lineTo(c*cellW,rows*cellH);
            ctx.stroke();
        }
        for(let r=0;r<=rows;r++){
            ctx.beginPath();
            ctx.moveTo(0,r*cellH);
            ctx.lineTo(cols*cellW,r*cellH);
            ctx.stroke();
        }
        // Decode grid
        const data = Uint8Array.from(atob(grid),c=>c.charCodeAt(0));
        // Draw cells
        for(let y=0;y<rows;y++){
            for(let x=0;x<cols;x++){
                const v = data[y*cols+x];
                if (v===0) continue;
                const px = x*cellW, py = y*cellH;
                if (v===255){
                    ctx.fillStyle = '#2a2f3a';
                    ctx.fillRect(px,py,cellW,cellH);
                } else {
                    const col = BEANS[v-1].color;
                    ctx.fillStyle = dimColor(col,0.5);
                    ctx.fillRect(px,py,cellW,cellH);
                }
            }
        }
        // Arena bounds
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(minX*cellW, minY*cellH, (maxX-minX+1)*cellW, (maxY-minY+1)*cellH);
        // Riders heads
        state.riders.forEach(r=>{
            if (!r.alive) return;
            const cx = (r.x+0.5)*cellW;
            const cy = (r.y+0.5)*cellH;
            const sz = cellW*2.8, col = BEANS[r.id-1].color, im = BIMG[r.id-1];
            ctx.save();
            ctx.translate(cx,cy);
            ctx.beginPath(); ctx.arc(0,0,sz*0.42,0,2*Math.PI);
            ctx.fillStyle = col+'40'; ctx.shadowColor = col; ctx.shadowBlur = 14; ctx.fill();
            ctx.shadowBlur = 0;
            ctx.rotate(r.dir*Math.PI/2 + Math.PI/2);
            if (im.complete && im.naturalWidth) ctx.drawImage(im,-sz/2,-sz/2,sz,sz);
            else { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0,0,cellW*0.4,cellH*0.3,0,0,2*Math.PI); ctx.fill(); }
            ctx.restore();
        });
        ctx.restore();
        requestAnimationFrame(draw);
    }
    function dimColor(hex, factor){
        const r = Math.round(parseInt(hex.slice(1,3),16)*factor);
        const g = Math.round(parseInt(hex.slice(3,5),16)*factor);
        const b = Math.round(parseInt(hex.slice(5,7),16)*factor);
        return `rgb(${r},${g},${b})`;
    }
    // ---------- Input ----------
    for (const [id,d] of [['tl',-1],['tr',1]]) document.getElementById(id).addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();send({t:'turn',d});});
    function send(msg){ if(wsOpen) ws.send(JSON.stringify(msg)); }
    // Keyboard
    window.addEventListener('keydown',e=>{
        if(screen!=='game') return;
        const map = {ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
        if(map[e.code]!==undefined){
            e.preventDefault();
            send({t:'aim',dir:map[e.code]});
        }
    });
    // Touch
    canvas.addEventListener('touchstart',e=>{
        if(screen!=='game') return;
        const t = e.touches[0];
        lastTouch={x:t.clientX,y:t.clientY,time:Date.now()};
    });
    canvas.addEventListener('touchend',e=>{
        if(screen!=='game' || !lastTouch) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - lastTouch.x;
        const dy = t.clientY - lastTouch.y;
        const dt = Date.now() - lastTouch.time;
        const dist = Math.hypot(dx,dy);
        if(dist>20 && dt<500){
            // swipe
            const absX = Math.abs(dx), absY = Math.abs(dy);
            let dir;
            if(absX>absY){
                dir = dx>0?1:3; // right or left
            }else{
                dir = dy>0?2:0; // down or up
            }
            send({t:'aim',dir});
        }else{
            // tap left/right
            const half = canvas.clientWidth/2;
            const d = (t.clientX<half)?-1:1;
            send({t:'turn',d});
        }
        lastTouch=null;
    });
    // Prevent scrolling
    document.body.addEventListener('touchmove',e=>{ if(screen==='game') e.preventDefault(); },{passive:false});
})();
</script>
</body>
</html>
